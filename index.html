<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/axios@1.13.2/dist/axios.min.js"></script>
  <script src="js/index.js" defer></script>

  <title>Frontend Mentor | Time tracking dashboard</title>

</head>
<body>
  <main class="reports">
    <header class="report-card" data-variant="header">
      <div class="report-card__header">
        <img src="images/image-jeremy.png" alt="Jeremy Robson" class="report-card__user-image">
        <h1 class="report-card__heading">
          <span class="report-card__for d-block">Report for</span>
          <strong class="report-card__username d-block">Jeremy Robson</strong>
        </h1>
      </div>
      <div class="report-card__menu">
        <input type="radio" class="report-card__radio" id="daily" name="timeframe" value="daily">
        <label for="daily" class="report-card__label">Daily</label>

        <input type="radio" class="report-card__radio" id="weekly" name="timeframe" value="weekly">
        <label for="weekly" class="report-card__label">Weekly</label>

        <input type="radio" class="report-card__radio" id="monthly" name="timeframe" value="monthly">
        <label for="monthly" class="report-card__label">Monthly</label>
      </div>
    </header>
  </main>
</body>
</html>
