<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="css/index.css">

  <title>Frontend Mentor | Time tracking dashboard</title>

</head>
<body>
  <main class="reports">
    <header class="report-card" data-variant="header">
      <h1 class="report-card__heading">
        <span class="report-card__for d-block">Report for</span>
        <strong class="report-card__username d-block">Jeremy Robson</strong>

      </h1>
      <div class="report-card__menu">
        <button type="button" class="report-card__option">Daily</button>
        <button type="button" class="report-card__option">Weekly</button>
        <button type="button" class="report-card__option">Monthly</button>
      </div>
    </header>
    <section class="report-card">
      <h2 class="report-card__title">Work</h2>
      <button class="report-card__option-btn"><img src="images/icon-ellipsis.svg" alt="open options menu"></button>
      <div class="report-card__content" data-name="daily"> <!-- daily -->
        <span class="report-card__time">5hrs</span>
        <span class="report-card__previous">Previous - 7hrs</span>
      </div>
      <div class="report-card__content" data-name="weekly"> <!-- weekly -->
        <span class="report-card__time">32hrs</span>
        <span class="report-card__previous">Previous - 36hrs</span>
      </div>
      <div class="report-card__content" data-name="monthly"> <!-- monthly -->
        <span class="report-card__time">103hrs</span>
        <span class="report-card__previous">Previous - 128hrs</span>
      </div>
    </section>


  </main>
</body>
</html>
